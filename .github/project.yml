# yaml-language-server: $schema=https://raw.githubusercontent.com/cuioss/cuioss-organization/main/.github/actions/read-project-config/schema.json
name: cui-java-module-template
description: Template for cuioss Java modules

# MERGING A CHANGE OF current-version IS A RELEASE to Maven Central (central version-changed guard
# in reusable-maven-release.yml). Never change it while customizing or in an ordinary PR:
# 0.1.0 is the first release of a derived repository, cut deliberately via workflow_dispatch.
# Later versions go through the release runbook (.claude/skills/release/SKILL.md).
release:
  current-version: 0.1.0
  next-version: 0.1.1-SNAPSHOT
  create-github-release: true

maven-build:
  java-versions: '["21","25"]'
  java-version: '21'
  enable-snapshot-deploy: true
  maven-profiles-snapshot: 'release-snapshot,javadoc'
  maven-profiles-release: 'release,javadoc'
  npm-cache: false

sonar:
  project-key: cuioss_cui-java-module-template
  enabled: true
  skip-on-dependabot: true

pages:
  reference: cui-java-module-template
  deploy-at-release: true
github-automation:
  auto-merge-build-versions: true
