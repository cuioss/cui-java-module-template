# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1
  # No github-actions lane on purpose: the only `uses:` are the SHA-pinned cuioss-organization
  # workflows, which the org release bumps via its consumers list (keep this repository in
  # cuioss-organization/.github/project.yml `consumers:`). Add a github-actions lane (cooldown:
  # default-days only) as soon as a workflow uses any other action; a docker lane per digest-pinned
  # Dockerfile directory likewise.
