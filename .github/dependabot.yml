# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 1

  # Bumps third-party actions pinned by SHA. The cuioss-organization workflow pins are NOT updated
  # here but by the cuioss-release-bot (org release, consumers list), so this lane is idle until a
  # workflow uses another action. Add a docker lane per digest-pinned Dockerfile directory likewise.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
